name: AquaBilljo Quality Check

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f SECURITY.md

          echo "Required files are present."

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Checking: $file"
            node --check "$file"
          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files found."
          else
            echo "JavaScript syntax check passed."
          fi

      - name: Check service worker
        shell: bash
        run: |
          set -e

          if [ -f "service-worker.js" ]; then
            node --check service-worker.js
            echo "service-worker.js syntax is valid."
          else
            echo "No service-worker.js found."
          fi
